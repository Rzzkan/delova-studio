# Ganti 3410 dengan HOST_PORT yang Anda pakai. Pasang SSL dengan: certbot --nginx -d studio.delova.id
server {
  listen 80;
  server_name studio.delova.id;

  client_max_body_size 40m;          # upload gambar untuk edit
  proxy_read_timeout 360s;           # generate gambar bisa sampai beberapa menit
  proxy_send_timeout 360s;

  location / {
    proxy_pass http://127.0.0.1:3410;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;             # /mcp memakai streaming
  }
}
